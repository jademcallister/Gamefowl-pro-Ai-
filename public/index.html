<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gamefowl Pro AI</title>
<style>
:root{--bg:#0e0e0e;--sf:#181818;--sf2:#1c1c1c;--bd:#2a2a2a;--ac:#c8932a;--mu:#817a73;--tx:#e8e0d4;--ok:#2ecc71;--dn:#c0392b;--bl:#4aa3df;--wn:#d8b241}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif}body{background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,#1a1a1a 39px,#1a1a1a 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,#1a1a1a 39px,#1a1a1a 40px);background-size:40px 40px}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.mono{font-family:"Courier New",monospace}.disp{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;letter-spacing:2px}header{height:52px;background:var(--sf);border-bottom:2px solid var(--ac);position:sticky;top:0;z-index:100;display:flex;align-items:center;padding:0 14px;gap:10px}.brand{font-size:22px;color:var(--ac)}.badge{margin-left:auto;border:1px solid var(--bd);padding:3px 7px;font-size:9px;color:var(--mu)}nav{display:flex;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:52px;z-index:95;padding:0 4px;scrollbar-width:none}nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);text-transform:uppercase;letter-spacing:1.4px;font:10px "Courier New",monospace;padding:12px 11px;white-space:nowrap}nav button.active{border-bottom-color:var(--ac);color:var(--ac)}.ticker{background:var(--sf);border-bottom:1px solid var(--bd);padding:9px 14px;position:sticky;top:90px;z-index:90}.trow{display:flex;justify-content:space-between;align-items:end}.bigscore{font-size:38px;line-height:1}.progress{height:5px;background:var(--bd);margin:6px 0;overflow:hidden}.progress>div{height:100%}.minirow{display:flex;gap:3px}.mini{flex:1;text-align:center}.minibar{height:13px;background:#111;position:relative;overflow:hidden}.minibar>div{position:absolute;bottom:0;left:0;right:0}.wrap{max-width:760px;margin:0 auto;padding:14px 12px 104px}.section-title{display:flex;align-items:center;gap:10px;margin:4px 0 16px}.section-title h2{font-size:25px;margin:0}.section-title .line{height:1px;background:var(--bd);flex:1}.section-title small{font:9px "Courier New",monospace;color:var(--mu);letter-spacing:1px}.card{background:var(--sf);border:1px solid var(--bd);padding:16px;margin-bottom:12px}.ct{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;letter-spacing:2px;color:var(--ac);font-size:17px;margin-bottom:10px}.label{font:9px "Courier New",monospace;letter-spacing:1.7px;color:var(--mu);text-transform:uppercase;margin:0 0 5px}.field{margin-bottom:10px}input,select,textarea{width:100%;background:#111;border:1px solid var(--bd);color:var(--tx);font:13px "Courier New",monospace;padding:10px 12px;outline:none;border-radius:0}textarea{min-height:64px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd)}.stat{background:var(--sf);text-align:center;padding:14px}.scorecat{background:var(--sf2);border:1px solid var(--bd);padding:14px;margin-bottom:10px}.scorehead{display:flex;justify-content:space-between;gap:10px}.scoreval{font-size:34px;line-height:1}.check{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none}.box{width:22px;height:22px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0}.check.on{background:rgba(200,147,42,.10)}.check.on .box{background:var(--ac);border-color:var(--ac);color:#111;font-weight:bold}.rangeRow{display:flex;align-items:center;gap:8px;margin:10px 0}.rangeRow input{padding:0;border:0;background:none}.pill{display:inline-block;padding:4px 8px;border:1px solid currentColor;margin:2px 3px 2px 0;font:10px "Courier New",monospace}.divhead{font:9px "Courier New",monospace;letter-spacing:1.7px;color:var(--mu);text-transform:uppercase;border-bottom:1px solid var(--bd);padding-bottom:5px;margin:14px 0 7px}.photoGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photoSlot{background:#111;border:1px solid var(--bd);padding:8px}.photoTitle{display:flex;justify-content:space-between;gap:8px;font:10px "Courier New",monospace;color:var(--ac);margin-bottom:7px}.photoBox{aspect-ratio:4/3;background:#090909;border:1px dashed #444;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photoBox img{width:100%;height:100%;object-fit:cover}.photoEmpty{color:#555;text-align:center;font:10px "Courier New",monospace;padding:10px;line-height:1.5}.photoBtns{display:flex;gap:6px;margin-top:7px}.btn{border:1px solid var(--bd);background:none;color:var(--mu);padding:8px 10px;font:9px "Courier New",monospace;letter-spacing:1.3px;text-transform:uppercase}.btn.primary{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}.btn.danger{color:var(--dn);border-color:var(--dn)}.btn.blue{color:var(--bl);border-color:var(--bl)}.btn.ok{color:var(--ok);border-color:var(--ok)}.record{background:var(--sf);border:1px solid var(--bd);padding:14px;margin-bottom:8px;display:flex;gap:12px}.recordMain{flex:1}.filterRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.note{background:#1a160d;border:1px solid #5a4320;color:#ead9bd;padding:10px 12px;font:11px "Courier New",monospace;line-height:1.55}.aiBox{background:#101419;border:1px solid #29455d;padding:14px;margin-top:12px}.aiGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.aiItem{border:1px solid #263746;background:#0d1115;padding:10px}.aiLabel{font:9px "Courier New",monospace;color:var(--bl);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:5px}.aiValue{font-size:13px;line-height:1.45}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #555;border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}footer{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;gap:8px;padding:10px 12px;z-index:100}footer button{flex:1;padding:12px 5px}.toast{position:fixed;bottom:82px;right:14px;background:var(--ac);color:#111;padding:10px 14px;font:11px "Courier New",monospace;letter-spacing:1px;z-index:999;opacity:0;transform:translateY(15px);transition:.25s;pointer-events:none}.toast.on{opacity:1;transform:translateY(0)}.hidden{display:none!important}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:12px;vertical-align:top}th{color:var(--ac);font:9px "Courier New",monospace;letter-spacing:1.2px;text-transform:uppercase}@media(max-width:540px){.grid2,.aiGrid{grid-template-columns:1fr}.photoGrid{grid-template-columns:1fr}.wrap{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<header><span style="font-size:21px">🐓</span><div class="brand disp">Gamefowl Pro AI</div><div class="badge mono">PHOTO + PEDIGREE + AI</div></header>
<nav id="nav"></nav><div id="ticker" class="ticker"></div><main id="app" class="wrap"></main>
<footer><button class="btn primary" id="saveBtn">Save Bird</button><button class="btn" id="clearBtn">Clear</button><button class="btn" id="csvBtn">CSV</button></footer>
<div id="toast" class="toast"></div><input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden">
<script>
const CATS=[{key:"mentality",name:"Mentality / Disposition",checks:["Alert and aware","Confident, not flighty","Strong eye focus","Quick reaction","Calm to handle"]},{key:"structure",name:"Structure / Conformation",checks:["Wide chest","Balanced frame","Straight legs","Good station","No defects"]},{key:"muscle",name:"Muscle / Condition",checks:["Firm breast muscle","Strong thighs","Athletic feel","Not overfat","Not soft"]},{key:"feather",name:"Feather Quality",checks:["Tight feathering","Glossy feathers","No fraying","No parasites","Healthy skin"]},{key:"legs",name:"Legs & Feet",checks:["Clean scales","Straight toes","Strong foot spread","Good spur placement","Good balance"]},{key:"head",name:"Head / Eyes",checks:["Bright clear eyes","Strong expression","Clean nostrils","Proper beak","Healthy comb"]},{key:"lineage",name:"Bloodline Traits",checks:["Matches family type","Consistent markings","Carries desired traits","No off-type faults","Fits breeding goal"]},{key:"health",name:"Health Check",checks:["Clear breathing","Clean vent","Good energy","No mites/lice","No recurring sickness"]}];
const BLOODLINES=["General / Unknown","Hatch","Roundhead","Grey","Kelso","Sweater","Claret","Radio","Butcher","Lemon","Custom"];
const BL_NOTES={"Hatch":"Prioritize bone, strength, rugged frame, station, vigor, and consistent family type.","Roundhead":"Prioritize balance, alertness, station, clean structure, style, and head/eye quality.","Grey":"Prioritize tight feather, balance, leg/foot quality, alertness, and clean family traits.","Kelso":"Prioritize balance, athletic structure, station, strong eye, and overall proportion.","Sweater":"Prioritize athletic build, tight feather, muscle, alertness, and clean legs/feet.","Claret":"Prioritize structure, station, head/eye, health, and family consistency.","Radio":"Prioritize balance, station, feather, eye, and clean physical correctness.","Butcher":"Prioritize power, body, health, station, and bone.","Lemon":"Prioritize family type, balance, feather, structure, and vigor.","General / Unknown":"Use the general standard and score the bird on its own merits first.","Custom":"Use your own family standard and document it in the pedigree notes."};
const PHOTO_SLOTS=[["P01","Left lateral"],["P02","Right lateral"],["P03","Front full-body"],["P04","Rear full-body"],["P05","Left head profile"],["P06","Right head profile"],["P07","Frontal head"],["P08","3/4 head"],["P09","Legs / feet front"],["P10","Legs / feet side"],["P11","Dorsal / top"],["P12","Wingspan"]];
const initForm=()=>({band:"",sex:"Cock",bloodline:"General / Unknown",farmFamily:"",age:"",source:"",date:new Date().toISOString().slice(0,10),notes:"",sire:"",dam:"",pgs:"",pgd:"",mgs:"",mgd:"",purpose:"Foundation breeder",pedigreeNotes:"",photoNotes:"",aiAnalysis:null,aiApplied:false});
const initScores=()=>Object.fromEntries(CATS.map(c=>[c.key,{base:1,checks:c.checks.map(()=>false),notes:""}]));
let state={tab:"evaluate",form:initForm(),scores:initScores(),records:loadRecords(),filter:"all",photoURLs:{},photoCount:0,activePhotoSlot:null,aiBusy:false};
function loadRecords(){try{return JSON.parse(localStorage.getItem("gfp_ai_v1")||"[]")}catch(e){return[]}}function persistRecords(){localStorage.setItem("gfp_ai_v1",JSON.stringify(state.records))}function eff(s){return Math.min(10,s.base+s.checks.filter(Boolean).length)}function total(){return CATS.reduce((a,c)=>a+eff(state.scores[c.key]),0)}function cls(n){if(n>=65)return{label:"FOUNDATION",key:"elite",color:"#4aa3df"};if(n>=50)return{label:"IMPROVER",key:"good",color:"#2ecc71"};if(n>=35)return{label:"HOLD/TEST",key:"ok",color:"#d8b241"};return{label:"CULL",key:"bad",color:"#c0392b"}}function sColor(v){return v>=8?"#2ecc71":v>=5?"#c8932a":"#c0392b"}function esc(s=""){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1900)}
const tabs=[["evaluate","Evaluate"],["photos","Photos"],["ai","AI Analysis"],["compare","Compare"],["decision","Decision"],["pedigree","Pedigree"],["families","Families"],["records","Records"],["guide","Guide"]];
function renderNav(){document.getElementById("nav").innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" class="${state.tab===k?"active":""}">${l}</button>`).join("");document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
function renderTicker(){const el=document.getElementById("ticker");if(!["evaluate","decision","photos","ai"].includes(state.tab)){el.classList.add("hidden");return}el.classList.remove("hidden");const t=total(),c=cls(t);el.innerHTML=`<div class="trow"><div><span class="bigscore disp" style="color:${c.color}">${t}</span><span class="mono" style="color:var(--mu);font-size:10px"> /80</span></div><div style="text-align:right"><div class="disp" style="font-size:19px;color:${c.color}">${c.label}</div><div class="mono" style="font-size:8px;color:var(--mu)">LIVE SCORE · ${state.photoCount}/12 PHOTOS</div></div></div><div class="progress"><div style="width:${t/80*100}%;background:${c.color}"></div></div><div class="minirow">${CATS.map(cat=>{const v=eff(state.scores[cat.key]);return `<div class="mini"><div class="minibar"><div style="height:${v*10}%;background:${sColor(v)}"></div></div><span class="mono" style="font-size:7px;color:${sColor(v)}">${v}</span></div>`}).join("")}</div>`}
function title(t,tag){return `<div class="section-title"><h2 class="disp">${t}</h2><div class="line"></div><small>${tag}</small></div>`}function fld(label,html){return `<div class="field"><div class="label">${label}</div>${html}</div>`}function input(k,ph=""){return `<input data-f="${k}" value="${esc(state.form[k])}" placeholder="${esc(ph)}">`}function select(k,opts){return `<select data-f="${k}">${opts.map(o=>`<option ${state.form[k]===o?"selected":""}>${o}</option>`).join("")}</select>`}
function evaluateHTML(){return title("Evaluate","ASSESSMENT")+`<div class="card"><div class="ct">Bird ID</div><div class="grid2">${fld("Band / ID",input("band","e.g. R-101"))}${fld("Sex",select("sex",["Cock","Hen","Stag","Pullet"]))}</div>${fld("Bloodline",select("bloodline",BLOODLINES))}${fld("Farm Family / Branch",input("farmFamily","e.g. McAllister Kelso A, Blueface Hatch #1"))}<div class="grid2">${fld("Age",input("age","e.g. 9 months"))}${fld("Date",`<input type="date" data-f="date" value="${esc(state.form.date)}">`)}</div>${fld("Source",input("source","Breeder / farm"))}</div><div class="card"><div class="ct">Score Categories</div><div class="note" style="margin-bottom:14px">Set base 1–5. Each checked trait adds +1, maximum 10 per category.</div>${CATS.map(cat=>{const s=state.scores[cat.key],v=eff(s),bonus=s.checks.filter(Boolean).length,col=sColor(v);return `<div class="scorecat" style="border-left:3px solid ${col}"><div class="scorehead"><div><strong>${cat.name}</strong><div class="mono" style="font-size:9px;color:var(--mu);margin-top:3px">base ${s.base}${bonus?` + ${bonus} bonus`:""}</div></div><div style="text-align:right"><div class="scoreval disp" style="color:${col}">${v}</div><div class="mono" style="font-size:8px;color:var(--mu)">/10</div></div></div><div class="progress"><div style="width:${v*10}%;background:${col}"></div></div><div class="rangeRow"><span class="label" style="margin:0">BASE</span><input type="range" min="1" max="5" value="${s.base}" data-base="${cat.key}"><span class="mono">${s.base}</span></div>${cat.checks.map((ch,i)=>`<div class="check ${s.checks[i]?"on":""}" data-check="${cat.key}" data-i="${i}"><div class="box">${s.checks[i]?"✓":""}</div><span style="flex:1;font-size:13px">${ch}</span><span class="mono" style="font-size:9px;color:${s.checks[i]?"var(--ac)":"#444"}">${s.checks[i]?"+1":"—"}</span></div>`).join("")}<textarea data-snote="${cat.key}" placeholder="Notes…" style="margin-top:10px">${esc(s.notes)}</textarea></div>`}).join("")}${fld("General Notes",`<textarea data-f="notes" placeholder="Handling notes, observations…">${esc(state.form.notes)}</textarea>`)}</div>`}
function photosHTML(){const bid=state.form.band.trim();return title("Photos","P01–P12 STANDARD")+`<div class="card"><div class="ct">Photo Record</div><div class="note">${bid?`Photos are stored on this device under bird ID <b>${esc(bid)}</b>.`:`Enter a Band / ID on the Evaluate tab before adding photos.`}</div><div style="margin-top:12px">${fld("Photo / phenotype notes",`<textarea data-f="photoNotes" placeholder="Pose quality, scale reference, visible traits, retake notes…">${esc(state.form.photoNotes)}</textarea>`)}</div><button class="btn blue" id="goAI" ${state.photoCount?"":"disabled"}>Analyze Stored Photos with AI</button></div><div class="photoGrid">${PHOTO_SLOTS.map(([id,name])=>{const u=state.photoURLs[id];return `<div class="photoSlot"><div class="photoTitle"><span>${id}</span><span style="color:var(--tx)">${name}</span></div><div class="photoBox">${u?`<img src="${u}" alt="${id} ${name}">`:`<div class="photoEmpty">NO PHOTO<br>${name}</div>`}</div><div class="photoBtns"><button class="btn primary photoAdd" data-slot="${id}" ${bid?"":"disabled"}>${u?"Replace":"Add Photo"}</button>${u?`<button class="btn danger photoDel" data-slot="${id}">Delete</button>`:""}</div></div>`}).join("")}</div><div class="card" style="margin-top:12px"><div class="ct">Photo Standard</div><div style="font-size:13px;line-height:1.65">Use a level surface, natural stance, camera near mid-body height, and a consistent background. For measurement photos, include a ruler or known-size reference in the same plane as the bird. Avoid forcing the neck, tail, or legs into an artificial pose.</div></div>`}
function aiHTML(){const a=state.form.aiAnalysis;return title("AI Analysis","VISION PHENOTYPE")+`<div class="card"><div class="ct">Automatic Phenotype Evaluation</div><div class="note">The AI analyzes only what is visible in the stored photos. It should not infer pedigree, bloodline identity, exact measurements, or genetic inheritance from appearance alone.</div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="runAI" ${state.photoCount&&!state.aiBusy?"":"disabled"}>${state.aiBusy?'<span class="spinner"></span>Analyzing…':"Analyze Photos"}</button>${a?`<button class="btn danger" id="clearAI">Clear AI Result</button>`:""}</div></div>${a?renderAIResult(a):`<div class="card"><div class="mono" style="color:var(--mu);font-size:11px;line-height:1.65">Add at least one photo, preferably P01 left lateral plus P03 front and P05/P06 head profile. Then tap <b style="color:var(--ac)">Analyze Photos</b>.</div></div>`}`}
function renderAIResult(a){const obs=a.observations||[],conf=a.confidence||{},ratios=a.proportional_assessment||{};return `<div class="aiBox"><div class="ct" style="color:var(--bl)">AI Phenotype Report</div><div class="aiGrid"><div class="aiItem"><div class="aiLabel">Overall silhouette</div><div class="aiValue">${esc(a.overall_silhouette||"—")}</div></div><div class="aiItem"><div class="aiLabel">Photo adequacy</div><div class="aiValue">${esc(a.photo_adequacy||"—")}</div></div><div class="aiItem"><div class="aiLabel">Head / cranial</div><div class="aiValue">${esc(a.head_cranial||"—")}</div></div><div class="aiItem"><div class="aiLabel">Neck / shoulder</div><div class="aiValue">${esc(a.neck_shoulder||"—")}</div></div><div class="aiItem"><div class="aiLabel">Body / topline</div><div class="aiValue">${esc(a.body_structure||"—")}</div></div><div class="aiItem"><div class="aiLabel">Legs / feet</div><div class="aiValue">${esc(a.legs_feet||"—")}</div></div><div class="aiItem"><div class="aiLabel">Wing / tail / feather</div><div class="aiValue">${esc(a.wing_tail_feather||"—")}</div></div><div class="aiItem"><div class="aiLabel">Visible symmetry</div><div class="aiValue">${esc(a.symmetry||"—")}</div></div></div><div class="divhead">AI score suggestions</div>
<div class="aiGrid">${scoreRows||'<div class="mono" style="font-size:11px;color:var(--mu)">No score suggestions returned.</div>'}</div>
<div style="margin-top:10px"><button class="btn primary" id="applyAIScores">${state.form.aiApplied?"Re-apply AI to Scorecard":"Apply AI to Scorecard"}</button></div>
<div class="divhead">Farm-family phenotype signature</div>${familyPills||'<span class="mono" style="font-size:11px;color:var(--mu)">Not enough information.</span>'}
<div class="divhead">Proportional assessment</div>${Object.entries(ratios).length?Object.entries(ratios).map(([k,v])=>`<span class="pill" style="color:var(--bl)">${esc(k.replaceAll("_"," "))}: ${esc(v)}</span>`).join(""):`<span class="mono" style="font-size:11px;color:var(--mu)">Not enough visual information.</span>`}<div class="divhead">Observed traits</div>${obs.length?obs.map(x=>`<div style="font-size:12px;line-height:1.55;padding:5px 0;border-bottom:1px solid #263746">${esc(x)}</div>`).join(""):`<div class="mono" style="color:var(--mu);font-size:11px">None listed.</div>`}<div class="divhead">Limitations / needed retakes</div><div style="font-size:12px;line-height:1.6">${esc((a.limitations||[]).join(" • ")||"None stated.")}</div><div class="divhead">Confidence</div><div style="font-size:12px;line-height:1.6">${Object.entries(conf).map(([k,v])=>`${esc(k)}: <b>${esc(v)}</b>`).join(" · ")||"—"}</div><div class="divhead">Summary</div><div style="font-size:13px;line-height:1.65">${esc(a.summary||"—")}</div></div>`}
function decisionHTML(){const t=total(),c=cls(t),weak=CATS.filter(x=>eff(state.scores[x.key])<=4).map(x=>x.name),strong=CATS.filter(x=>eff(state.scores[x.key])>=8).map(x=>x.name);const verdict=t>=65&&weak.length===0?"Candidate for foundation breeding. Producer-test before making it central to the family.":t>=65?"High score — address weak categories before tight breeding.":t>=50?"Useful as an improver only if it corrects a specific weakness.":t>=35?"Hold only if young or unconditioned. Do not build a family around this bird.":"Do not breed. Removing weak traits protects the future family.";const breed=t>=70&&weak.length===0?"Linebreeding candidate — tighten family traits if related stock is strong.":t>=65?"Foundation candidate — breed only to a mate that covers weak points.":t>=50?"Outcross/improver — use for one specific purpose only.":"Do not breed until proven better with age, or remove from the plan.";return title("Decision","ANALYSIS")+`<div class="grid3"><div class="stat"><div class="disp" style="font-size:25px;color:var(--ac)">${t}</div><div class="label">Score /80</div></div><div class="stat"><div class="disp" style="font-size:22px;color:${c.color}">${c.label}</div><div class="label">Class</div></div><div class="stat"><div class="disp" style="font-size:25px;color:var(--ac)">${state.photoCount}</div><div class="label">Photos</div></div></div><div class="card" style="margin-top:12px;text-align:center;border:2px solid ${c.color}"><div class="disp" style="font-size:39px;color:${c.color}">${c.label}</div><div class="mono" style="font-size:11px;color:var(--mu)">${t}/80 · ${esc(state.form.band||"No ID")} · ${esc(state.form.bloodline)}</div></div><div class="card"><div class="divhead">Strengths</div>${strong.length?strong.map(x=>`<span class="pill" style="color:var(--ok)">${x}</span>`).join(""):`<span class="mono" style="font-size:11px;color:var(--mu)">None yet.</span>`}<div class="divhead">Weaknesses</div>${weak.length?weak.map(x=>`<span class="pill" style="color:va function familyDatabase(){
 const groups={};
 for(const r of state.records){
   const name=(r.farmFamily||"").trim();
   if(!name)continue;
   if(!groups[name])groups[name]={name,birds:[],bloodlines:{},signatures:{}};
   const g=groups[name];g.birds.push(r);
   g.bloodlines[r.bloodline||"Unknown"]=(g.bloodlines[r.bloodline||"Unknown"]||0)+1;
   const fs=r.aiAnalysis?.family_signature||{};
   for(const [k,v] of Object.entries(fs)){
     if(!v || typeof v!=="string")continue;
     const key=k+"::"+v;
     g.signatures[key]=(g.signatures[key]||0)+1;
   }
 }
 return Object.values(groups).sort((a,b)=>b.birds.length-a.birds.length);
}

const SIG_KEYS=["carriage","body_type","body_depth","neck_proportion","shank_proportion","tail_set","head_profile","beak_profile","feather_tightness","overall_balance"];

function similarityBetween(a,b){
  const sa=a?.aiAnalysis?.family_signature||{}, sb=b?.aiAnalysis?.family_signature||{};
  let matched=0, comparable=0, details=[];
  for(const k of SIG_KEYS){
    const av=sa[k], bv=sb[k];
    if(!av||!bv||String(av).includes("not assessable")||String(bv).includes("not assessable")) continue;
    comparable++;
    const same=av===bv;
    if(same) matched++;
    details.push({key:k,a:av,b:bv,same});
  }
  if(!comparable) return {score:null,matched:0,comparable:0,details};
  return {score:Math.round((matched/comparable)*100),matched,comparable,details};
}

function familyReferenceFor(name,excludeBand){
  const birds=state.records.filter(r=>(r.farmFamily||"").trim()===name && r.band!==excludeBand && r.aiAnalysis?.family_signature);
  if(!birds.length)return null;
  const ref={};
  for(const k of SIG_KEYS){
    const counts={};
    for(const r of birds){
      const v=r.aiAnalysis?.family_signature?.[k];
      if(!v||String(v).includes("not assessable"))continue;
      counts[v]=(counts[v]||0)+1;
    }
    const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    if(top)ref[k]=top[0];
  }
  return {name,birds,aiAnalysis:{family_signature:ref}};
}

function compareHTML(){

  const sire=all.find(r=>r.band===state.form.sire);
  const dam=all.find(r=>r.band===state.form.dam);
  const siblings=all.filter(r=>{
    const sameSire=state.form.sire && r.sire===state.form.sire;
    const sameDam=state.form.dam && r.dam===state.form.dam;
    return (sameSire||sameDam);
  });
  const famName=(state.form.farmFamily||"").trim();
  const famRef=famName?familyReferenceFor(famName,state.form.band):null;

  const candidates=[];
  if(sire)candidates.push({label:"Sire",r:sire});
  if(dam)candidates.push({label:"Dam",r:dam});

  if(famRef)candidates.push({label:"Farm Family Average",r:famRef});

  const scored=candidates.map(x=>({...x,sim:similarityBetween(cur,x.r)}))
    .filter(x=>x.sim.score!==null)

  ${scored.length?`

      <div class="ct">Closest Visible Phenotype Match</div>
      <div class="disp" style="font-size:30px;color:var(--bl)">${closest.sim.score}%</div>
      <div style="font-size:13px">${esc(closest.label)} · ${esc(closest.r.band||closest.r.name||"Family Reference")}</div>
      <div class="mono" style="font-size:9px;color:var(--mu);margin-top:5px">${closest.sim.matched}/${closest.sim.comparable} comparable phenotype traits matched</div>
    </div>
    ${scored.map(x=>`
      <div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div>
            <div class="disp" style="font-size:21px">${esc(x.label)}</div>
            <div class="mono" style="font-size:10px;color:var(--mu)">${esc(x.r.band||x.r.name||"Family Reference")}</div>
          </div>
          <div style="text-align:right">
            <div class="disp" style="font-size:28px;color:${x.sim.score>=80?"var(--ok)":x.sim.score>=60?"var(--ac)":"var(--mu)"}">${x.sim.score}%</div>
            <div class="label">Visible Match</div>
          </div>
        </div>
        <div class="divhead">Trait Comparison</div>
        ${x.sim.details.map(d=>`
          <div style="display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:11px">
            <div class="mono" style="color:${d.same?"var(--ok)":"var(--mu)"}">${esc(d.key.replaceAll("_"," "))}</div>
            <div>${esc(d.a)}</div>
            <div>${esc(d.b)} ${d.same?'<span style="color:var(--ok)">✓</span>':''}</div>
          </div>`).join("")}
      </div>`).join("")}
  `:`<div class="card"><div class="mono" style="color:var(--mu);font-size:11px;line-height:1.65">
    No comparison is available yet. Save and AI-analyze the sire, dam, siblings, or additional birds in the same Farm Family / Branch.
  </div></div>`}
  `;
}

function applyAIScoreSuggestions(showMessage=false){
 const a=state.form.aiAnalysis;
 if(!a?.score_suggestions)return;
 // Only categories with photographically supportable evidence are auto-applied.
 // Mentality and lineage remain manual. Health is only adjusted if the AI explicitly
 // identifies visible health-condition evidence; otherwise it remains unchanged.
 const allowed=["structure","muscle","feather","legs","head","health"];
 for(const key of allowed){
   const sug=a.score_suggestions[key];
   if(!sug || sug.apply===false) continue;
   const dst=state.scores[key];
   if(Number.isFinite(+sug.base)) dst.base=Math.max(1,Math.min(5,+sug.base));
   if(Array.isArray(sug.checks)){
     dst.checks=dst.checks.map((old,i)=>{
       const val=sug.checks[i];
       return typeof val==="boolean" ? val : old;
     });
   }
   const prefix="[AI photo assessment] ";
   if(sug.reason) dst.notes=prefix+sug.reason;
 }
 state.form.aiApplied=true;
 if(showMessage)toast("AI FINDINGS APPLIED TO SCORECARD");
 saveRecord(false);
}

function clearAll(){state.form=initForm();state.scores=initScores();state.photoURLs={};state.photoCount=0;toast("CLEARED");render()}function loadRecordByCreated(id,tab){const r=state.records.find(x=>x.created===id);if(!r)return;state.form={...initForm(),...r};state.scores=Object.fromEntries(CATS.map(c=>[c.key,{base:r.scores?.[c.key]?.base||1,checks:r.scores?.[c.key]?.checks||c.checks.map(()=>false),notes:r.scores?.[c.key]?.notes||""}]));state.tab=tab;toast("LOADED — "+r.band);render()}async function deleteRecord(id){const idx=state.records.findIndex(x=>x.created===id);if(idx<0)return;const band=state.records[idx].band;state.records.splice(idx,1);persistRecords();await deleteAllPhotosForBird(band);toast("DELETED — "+band);render()}function exportCSV(){if(!state.records.length){toast("NO RECORDS");return}const head=["Band","Date","Sex","Bloodline","Farm Family","Age","Source","Total","Class","Sire","Dam","Purpose","Notes","Pedigree Notes","Photo Notes","AI Summary","AI Family Signature"];const rows=[head,...state.records.map(r=>[r.band,r.date,r.sex,r.bloodline,r.farmFamily,r.age,r.source,r.total,r.cls,r.sire,r.dam,r.purpose,r.notes,r.pedigreeNotes,r.photoNotes,r.aiAnalysis?.summary||"",JSON.stringify(r.aiAnalysis?.family_signature||{})])];const csv=rows.map(row=>row.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="gamefowl_pro_ai_records.csv";a.click();URL.revokeObjectURL(a.href);toast("CSV EXPORTED")}
async function fileToDataURL(blob,maxSide=1600,quality=.84){return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(blob);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,maxSide/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);resolve(c.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=u})}
async function runAI(){if(!state.form.band.trim()){toast("ENTER BAND ID FIRST");return}const photos=await getPhotosForBird(state.form.band.trim());if(!Object.keys(photos).length){toast("ADD PHOTOS FIRST");return}state.aiBusy=true;render();try{const payloadPhotos=[];for(const [slot,blob] of Object.entries(photos)){payloadPhotos.push({slot,image:await fileToDataURL(blob)})}const resp=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bird:{band:state.form.band,sex:state.form.sex,age:state.form.age,bloodline:state.form.bloodline,source:state.form.source,photoNotes:state.form.photoNotes},photos:payloadPhotos})});const data=await resp.json();if(!resp.ok)throw new Error(data.error||"Analysis failed");state.form.aiAnalysis=data.analysis;state.form.aiApplied=false;state.aiBusy=false;applyAIScoreSuggestions(false);state.tab="ai";toast("AI ANALYSIS + SCORECARD COMPLETE");render()}catch(e){state.aiBusy=false;toast("AI ERROR — "+e.message);render()}}
let dbPromise;function db(){if(dbPromise)return dbPromise;dbPromise=new Promise((res,rej)=>{const q=indexedDB.open("gamefowl_pro_photos_ai",1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos",{keyPath:"key"})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});return dbPromise}async function putPhoto(band,slot,file){const d=await db(),key=band+"::"+slot;return new Promise((res,rej)=>{const tx=d.transaction("photos","readwrite");tx.objectStore("photos").put({key,band,slot,blob:file,updated:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function getPhotosForBird(band){if(!band)return{};const d=await db();return new Promise((res,rej)=>{const tx=d.transaction("photos","readonly"),req=tx.objectStore("photos").getAll();req.onsuccess=()=>{const out={};req.result.filter(x=>x.band===band).forEach(x=>out[x.slot]=x.blob);res(out)};req.onerror=()=>rej(req.error)})}async function deletePhoto(band,slot){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction("photos","readwrite");tx.objectStore("photos").delete(band+"::"+slot);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function deleteAllPhotosForBird(band){const d=await db();const all=await new Promise((res,rej)=>{const tx=d.transaction("photos","readonly"),r=tx.objectStore("photos").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return new Promise((res,rej)=>{const tx=d.transaction("photos","readwrite"),s=tx.objectStore("photos");all.filter(x=>x.band===band).forEach(x=>s.delete(x.key));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function refreshPhotoURLs(){Object.values(state.photoURLs).forEach(u=>URL.revokeObjectURL(u));state.photoURLs={};state.photoCount=0;const band=state.form.band.trim();if(!band)return;try{const ps=await getPhotosForBird(band);for(const [slot,blob] of Object.entries(ps)){state.photoURLs[slot]=URL.createObjectURL(blob);state.photoCount++}}catch(e){}}
document.getElementById("saveBtn").onclick=saveRecord;document.getElementById("clearBtn").onclick=clearAll;document.getElementById("csvBtn").onclick=exportCSV;document.getElementById("photoInput").onchange=async(e)=>{const f=e.target.files?.[0];if(!f||!state.activePhotoSlot)return;const band=state.form.band.trim();if(!band){toast("ENTER BAND ID FIRST");return}try{await putPhoto(band,state.activePhotoSlot,f);toast("PHOTO SAVED — "+state.activePhotoSlot);await render()}catch(err){toast("PHOTO SAVE FAILED")}};render();
</script></body></html>
